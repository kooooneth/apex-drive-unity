<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html,body{margin:0;height:100%;background:#0b0e14;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#eef1f7}
    #unity-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#0b0e14;outline:none}
    #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0b0e14;z-index:5}
    #loading h1{margin:0;font-size:clamp(36px,8vw,64px);letter-spacing:.04em;text-transform:uppercase}
    #loading h1 span{color:#ff4b2e}
    #bar{width:min(70vw,420px);height:8px;border-radius:4px;background:#1e2636;overflow:hidden}
    #fill{height:100%;width:0;background:#17d9c4;transition:width .2s}
    #pct{font-size:14px;color:#8b93a6}
    #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;font-size:12px;color:#c9d1e0;background:#000a;padding:6px 14px;border-radius:6px;pointer-events:none;transition:opacity .6s}
    #fs{position:fixed;right:10px;top:10px;z-index:4;font:600 12px system-ui,Arial;color:#eef1f7;background:#1e2636cc;border:1px solid #2b3446;border-radius:6px;padding:6px 10px;cursor:pointer;opacity:.7}
    #fs:hover{opacity:1}
    #error{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0b0e14;z-index:6}
  </style>
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#0b0e14">
  <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><h1>Apex <span>Drive</span></h1><div id="bar"><div id="fill"></div></div><div id="pct">Loading... 0%</div></div>
  <div id="hint">Click the game first, then drive with W A S D. Press Esc for the pause menu.</div>
  <button id="inst" data-install hidden style="position:fixed;right:96px;top:10px;z-index:4;font:600 12px system-ui,Arial;color:#0b0e14;background:#17d9c4;border:0;border-radius:6px;padding:6px 10px;cursor:pointer">Install app</button>
  <button id="fs">Fullscreen</button>
  <div id="error"><div><h2>This browser cannot run the game</h2><p>It needs WebGL 2. Try a recent Chrome, Edge or Firefox on a computer.</p></div></div>
  <script>
    var canvas = document.getElementById("unity-canvas");
    var loadingEl = document.getElementById("loading"), fill = document.getElementById("fill"), pct = document.getElementById("pct");
    var hint = document.getElementById("hint");
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      document.getElementById("error").style.display = "flex";
      document.getElementById("error").querySelector("p").textContent = "The game needs a keyboard, so it is made for a computer.";
    }
    var VER = {{{ JSON.stringify(PRODUCT_VERSION) }}};          // changes with every build, so a browser never mixes old and new files
    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}?v=" + VER,
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}?v=" + VER,
      codeUrl: "Build/{{{ CODE_FILENAME }}}?v=" + VER,
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      autoSyncPersistentDataPath: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.25)
    };
    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}?v=" + VER;
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        fill.style.width = (p * 100) + "%";
        pct.textContent = "Loading... " + Math.round(p * 100) + "%";
      }).then(function (inst) {
        window.apexInstance = inst;
        var q = new URLSearchParams(location.search).get("q");
        if (q !== null) inst.SendMessage("ApexDrive", "SetQuality", q);          // ?q=0..4 forces a graphics level
        loadingEl.style.display = "none";
        canvas.focus();
        document.getElementById("fs").onclick = function () { inst.SetFullscreen(1); };
        setTimeout(function () { hint.style.opacity = 0; }, 9000);
        canvas.addEventListener("mousedown", function () { hint.style.opacity = 0; });
      }).catch(function (m) {
        document.getElementById("error").style.display = "flex";
        document.getElementById("error").querySelector("p").textContent = String(m);
      });
    };
    document.body.appendChild(script);
  </script>
  <script src="../install.js"></script>
</body>
</html>
